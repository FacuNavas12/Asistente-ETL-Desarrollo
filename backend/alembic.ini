[alembic]
# Ruta al directorio que contiene env.py, script.py.mako y versions/.
script_location = alembic

# La URL se sobreescribe en alembic/env.py leyendo settings.database_url.
# Dejar el placeholder para que Alembic no falle al parsear el ini.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Formato de nombre de archivos de versión: fecha_rev_slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Codificación de los archivos generados
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
