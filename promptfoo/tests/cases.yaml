# Casos migrados desde backend/tests/test_api.py
# Cada mensaje es la reconstrucción exacta del prompt que el backend Python
# construye y envía al LLM (sin pasar por FastAPI).
#
# Prompts disponibles:
#   etl       → system_etl.txt      (generación de procesos ETL)
#   validator  → system_validator.txt (validación y documentación)
#   inference  → system_inference.txt (inferencia y refinamiento de estructuras)

# ══════════════════════════════════════════════════════════════════════════════
# BLOQUE 1 — Generación de procesos ETL (6 tests)
# Fuente: etl_generator._build_prompt() + etl_generator.generate_etl_from_inference()
# ══════════════════════════════════════════════════════════════════════════════

- description: "test_generar_etl_completo — ventas 5 cols → STG_VENTAS → DIM_CLIENTE + FACT_VENTAS"
  prompt: etl
  vars:
    message: |
      ## OBJETIVO DEL PROCESO ETL
      Cargar ventas diarias al DWH para análisis de revenue

      ## ESQUEMA DE ORIGEN

        Tabla: ventas
          - id_venta | tipo: INTEGER | rol: identificador | datos ejemplo: 1, 2, 3
          - fecha | tipo: DATE | formato: YYYY-MM-DD | rol: atributo | datos ejemplo: 2024-01-01, 2024-01-02
          - monto | tipo: DECIMAL | rol: medida | datos ejemplo: 100.50, 200.00, -5.00
          - id_cliente | tipo: INTEGER | rol: FK | datos ejemplo: 10, 11, 12
          - descripcion | tipo: VARCHAR | rol: atributo | datos ejemplo: Compra A, Compra B

      ## ESQUEMA DE STAGING

        Tabla: STG_VENTAS (origen: ventas)
          - id_venta (INTEGER) | reglas: No nulo | dato no válido: Rechazar fila
          - fecha (DATE) | reglas: Formato YYYY-MM-DD | dato no válido: Reemplazar por NULL
          - monto (DECIMAL) | reglas: Mayor a 0 | dato no válido: Rechazar fila
          - id_cliente (INTEGER) | reglas: No nulo, Existe en DIM_CLIENTE | dato no válido: Rechazar fila

      ## MODELO DE DWH

        Tabla Dimension: DIM_CLIENTE | origen: ventas
          - SK_CLIENTE (INTEGER) [SK]
          - id_cliente → ID_CLIENTE (INTEGER)

        Tabla Fact: FACT_VENTAS | origen: ventas
          - SK_VENTA (INTEGER) [SK]
          - id_cliente → SK_CLIENTE (INTEGER)
          - fecha → FECHA (DATE)
          - monto → MONTO (DECIMAL)

      ## REGLAS DE NEGOCIO

      Excluir ventas con monto negativo. Cargar solo registros del año 2024.

      ---

      Genera el proceso ETL completo respetando estrictamente el objetivo indicado.
      El mapeo "origen → nombre" indica que el campo se renombra entre capas; respetá los nombres destino exactos.
      Aplica todas las reglas de limpieza definidas en cada columna de staging.
      Verifica la consistencia de tipos y nombres entre las tres capas.
  assert:
    - type: javascript
      value: |
        try {
          const s = output.replace(/^```(?:json)?\n?|```\s*$/gm, '').trim();
          const d = JSON.parse(s);
          return 'proceso_etl' in d && 'validaciones' in d && 'ktr' in d;
        } catch(e) { return false; }
    - type: javascript
      value: |
        try {
          const s = output.replace(/^```(?:json)?\n?|```\s*$/gm, '').trim();
          const d = JSON.parse(s);
          return Array.isArray(d.proceso_etl?.steps) && d.proceso_etl.steps.length > 0;
        } catch(e) { return false; }
    - type: llm-rubric
      value: "El proceso ETL usa nombres de steps válidos de Pentaho PDI (ej: Table Input, Filter rows, Dimension lookup/update) y el objeto ktr tiene hops coherentes que conectan todos los steps en orden lógico."

