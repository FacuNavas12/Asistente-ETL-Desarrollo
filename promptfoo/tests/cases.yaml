# BLOQUE 2 — Validación y documentación (2 tests)
# Fuente: validator.validate_etl() y documenter.document_etl()
# ══════════════════════════════════════════════════════════════════════════════

- description: "test_validar_etl — ETL de 3 steps (TableInput → FilterRows → TableOutput)"
  prompt: validator
  vars:
    message: |
      Analiza el siguiente proceso ETL y detecta problemas de calidad y malas prácticas:

      ```json
      {
        "nombre": "ETL_VENTAS",
        "descripcion": "Carga de ventas al DWH",
        "steps": [
          {
            "orden": 1,
            "tipo_step_pdi": "TableInput",
            "nombre": "Leer ventas",
            "descripcion": "Lee la tabla de ventas del origen",
            "configuracion": {
              "connection": "origen_db",
              "sql": "SELECT * FROM ventas"
            },
            "justificacion": "Punto de entrada del ETL"
          },
          {
            "orden": 2,
            "tipo_step_pdi": "FilterRows",
            "nombre": "Filtrar montos negativos",
            "descripcion": "Elimina registros con monto <= 0",
            "configuracion": {
              "condition": "monto > 0"
            },
            "justificacion": "Regla de negocio: excluir montos negativos"
          },
          {
            "orden": 3,
            "tipo_step_pdi": "TableOutput",
            "nombre": "Cargar STG_VENTAS",
            "descripcion": "Inserta en staging",
            "configuracion": {
              "connection": "dwh_db",
              "table": "STG_VENTAS"
            },
            "justificacion": "Carga al staging"
          }
        ]
      }
      ```
  assert:
    - type: javascript
      value: |
        try {
          const s = output.replace(/^```(?:json)?\n?|```\s*$/gm, '').trim();
          const d = JSON.parse(s);
          return Array.isArray(d.validaciones) && Array.isArray(d.advertencias_buenas_practicas);
        } catch(e) { return false; }
    - type: llm-rubric
      value: "El análisis detecta al menos un problema real: SELECT * sin WHERE en TableInput (riesgo de full scan), ausencia de WriteToLog para trazabilidad, o ausencia de manejo de errores."

# ─────────────────────────────────────────────────────────────────────────────

- description: "test_documentar_etl — documentación narrativa del mismo ETL de 3 steps"
  prompt: validator
  vars:
    message: |
      Genera documentación técnica en lenguaje natural para el siguiente proceso ETL.

      La documentación debe:
      1. Describir el flujo completo de forma que un desarrollador nuevo lo entienda
      2. Explicar cada step en orden, qué hace y por qué existe
      3. Mencionar las reglas de negocio aplicadas
      4. Indicar los puntos de control de calidad del proceso

      Responde con un objeto JSON con la siguiente estructura:
      {
        "documentacion": "string — documentación completa en lenguaje natural"
      }

      Proceso ETL a documentar:

      ```json
      {
        "nombre": "ETL_VENTAS",
        "descripcion": "Carga de ventas al DWH",
        "steps": [
          {
            "orden": 1,
            "tipo_step_pdi": "TableInput",
            "nombre": "Leer ventas",
            "descripcion": "Lee la tabla de ventas del origen",
            "configuracion": {
              "connection": "origen_db",
              "sql": "SELECT * FROM ventas"
            },
            "justificacion": "Punto de entrada del ETL"
          },
          {
            "orden": 2,
            "tipo_step_pdi": "FilterRows",
            "nombre": "Filtrar montos negativos",
            "descripcion": "Elimina registros con monto <= 0",
            "configuracion": {
              "condition": "monto > 0"
            },
            "justificacion": "Regla de negocio: excluir montos negativos"
          },
          {
            "orden": 3,
            "tipo_step_pdi": "TableOutput",
            "nombre": "Cargar STG_VENTAS",
            "descripcion": "Inserta en staging",
            "configuracion": {
              "connection": "dwh_db",
              "table": "STG_VENTAS"
            },
            "justificacion": "Carga al staging"
          }
        ]
      }
      ```
  assert:
    - type: javascript
      value: |
        try {
          const s = output.replace(/^```(?:json)?\n?|```\s*$/gm, '').trim();
          const d = JSON.parse(s);
          return typeof d.documentacion === 'string' && d.documentacion.length > 100;
        } catch(e) { return false; }

# ══════════════════════════════════════════════════════════════════════════════
# BLOQUE 3 — Inferencia y refinamiento de estructuras (2 tests)
# Fuente: structure_inferrer._build_infer_prompt() y _build_refine_prompt()
# ══════════════════════════════════════════════════════════════════════════════

- description: "test_inferir_estructuras — origen ventas → inferir STG + modelo DWH estrella"
  prompt: inference
  vars:
    message: |
      A partir de la siguiente información, generá la definición de la tabla de Staging (STG) y el modelo de Data Warehouse (DWH) destino.

      ESTRUCTURA DE ORIGEN:
      [{"tableName": "ventas", "columns": [{"name": "id_venta", "dataType": "INTEGER", "role": "identificador", "data": ["1", "2", "3"]}, {"name": "fecha", "dataType": "DATE", "dataFormat": "YYYY-MM-DD", "data": ["2024-01-01", "2024-01-02"]}, {"name": "monto", "dataType": "DECIMAL", "role": "medida", "data": ["100.50", "200.00", "-5.00"]}, {"name": "id_cliente", "dataType": "INTEGER", "role": "FK", "data": ["10", "11", "12"]}, {"name": "descripcion", "dataType": "VARCHAR", "data": ["Compra A", "Compra B"]}]}]

      DESCRIPCIÓN DEL PROCESO / OBJETIVO:
      Cargar ventas diarias al DWH para análisis de revenue por cliente

      REGLAS DE NEGOCIO:
      Excluir montos negativos. Solo año 2024.

      Devuelve ÚNICAMENTE el JSON con la estructura de respuesta indicada. Sin texto adicional.
  assert:
    - type: javascript
      value: |
        try {
          const s = output.replace(/^```(?:json)?\n?|```\s*$/gm, '').trim();
          const d = JSON.parse(s);
          return d.stg_definition?.toUpperCase().includes('CREATE TABLE') &&
                 d.dwh_model?.toUpperCase().includes('CREATE TABLE');
        } catch(e) { return false; }
    - type: javascript
      value: |
        try {
          const s = output.replace(/^```(?:json)?\n?|```\s*$/gm, '').trim();
          const d = JSON.parse(s);
          return d.iteration === 1;
        } catch(e) { return false; }
    - type: llm-rubric
      value: "El STG tiene prefijo stg_ (ej: stg_ventas) e incluye los campos de auditoría (stg_fecha_carga, stg_origen, stg_estado). El DWH usa modelo estrella con al menos una dimensión (dim_cliente) y una tabla de hechos (fact_ventas)."

# ─────────────────────────────────────────────────────────────────────────────

- description: "test_refinar_estructuras — agregar columna descripcion VARCHAR(255) al STG existente"
  prompt: inference
  vars:
    message: |
