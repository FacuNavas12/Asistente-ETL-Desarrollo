- description: "test_generar_desde_inferencia — STG y DWH pre-validados como DDL SQL"
  prompt: etl
  vars:
    message: |
      ## OBJETIVO DEL PROCESO ETL
      Cargar ventas al DWH

      ## ESQUEMA DE ORIGEN

        Tabla: ventas
          - id_venta | tipo: INTEGER | rol: identificador | datos ejemplo: 1, 2, 3
          - fecha | tipo: DATE | formato: YYYY-MM-DD | rol: atributo | datos ejemplo: 2024-01-01, 2024-01-02
          - monto | tipo: DECIMAL | rol: medida | datos ejemplo: 100.50, 200.00, -5.00
          - id_cliente | tipo: INTEGER | rol: FK | datos ejemplo: 10, 11, 12
          - descripcion | tipo: VARCHAR | rol: atributo | datos ejemplo: Compra A, Compra B

      ## STAGING (inferido y confirmado por el usuario)

          CREATE TABLE STG_VENTAS (
              id_venta   INTEGER NOT NULL,
              fecha      DATE,
              monto      DECIMAL(10,2),
              id_cliente INTEGER
          );

      ## MODELO DWH (inferido y confirmado por el usuario)

          CREATE TABLE DIM_CLIENTE (SK_CLIENTE INTEGER PRIMARY KEY, ID_CLIENTE INTEGER);
          CREATE TABLE FACT_VENTAS (SK_VENTA INTEGER PRIMARY KEY, SK_CLIENTE INTEGER, FECHA DATE, MONTO DECIMAL(10,2));

      ## REGLAS DE NEGOCIO
      Excluir ventas con monto negativo. Cargar solo registros del año 2024.

      ---

      Genera el proceso ETL completo respetando estrictamente el objetivo indicado.
      Las estructuras STG y DWH ya fueron validadas por el usuario — usá exactamente esos nombres de tablas y columnas.
      Verifica la consistencia de tipos y nombres entre las tres capas.
  assert:
    - type: javascript
      value: |
        try {
          const s = output.replace(/^```(?:json)?\n?|```\s*$/gm, '').trim();
          const d = JSON.parse(s);
          return 'proceso_etl' in d && 'validaciones' in d && 'ktr' in d;
        } catch(e) { return false; }
    - type: javascript
      value: |
        try {
          const s = output.replace(/^```(?:json)?\n?|```\s*$/gm, '').trim();
          const d = JSON.parse(s);
          return Array.isArray(d.proceso_etl?.steps) && d.proceso_etl.steps.length > 0;
        } catch(e) { return false; }
    - type: llm-rubric
      value: "El ETL usa exactamente los nombres de tabla y columna del DDL provisto (STG_VENTAS, DIM_CLIENTE, FACT_VENTAS, SK_CLIENTE, SK_VENTA) sin inventar nombres alternativos."

